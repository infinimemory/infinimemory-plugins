<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MemStack settings</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="options">
  <header><strong>MEMSTACK</strong><span class="muted">settings</span></header>
  <p><button id="signin" type="button">Sign in with MemStack</button> <span class="muted">or paste a key below</span></p>
  <form id="form">
    <label>API key <input id="apiKey" type="password" placeholder="rc_…" autocomplete="off" required /></label>
    <label>Realm <input id="namespace" pattern="[a-zA-Z0-9_:\-]+" maxlength="255" required /></label>
    <label>API URL <input id="baseUrl" type="url" required /></label>
    <button type="submit">Save</button>
    <p id="status" class="muted" role="status" aria-live="polite"></p>
  </form>
  <p class="muted">Sign in opens the MemStack console, which gives this browser its own key (revoke it there any time). Or get a key from the console yourself. To share notes with your coding agents, use your repository's realm (<code>mem doctor</code> in the repository shows its name).</p>
  <script type="module" src="options.js"></script>
</body>
</html>
